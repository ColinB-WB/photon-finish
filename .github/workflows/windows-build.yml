name: windows-build

# NOT on every push. A PyInstaller build takes minutes and a docs commit cannot change
# its output, so this runs only when asked (workflow_dispatch: one-off checks, antivirus
# behaviour tests).
#
# Deliberately NO `push: tags: v*` trigger yet. On the public copy a release tag would
# publish this build as a downloadable artifact before anyone has installed it by hand.
# Add the tag trigger back once the installer has passed an antivirus scan and a
# hands-on test.
#
# Prefer running this on the PUBLIC photon-finish copy: Actions minutes are free there,
# while a private repo meters them and Windows runners bill at 2x. `.github/` is not in
# packaging/public_export.exclude, so the export carries this file to that copy; with no
# tag trigger, that is safe.
#
# Why this exists at all: on the maintainer's Windows machine Norton quarantines the
# freshly built exe as a generic heuristic before PyInstaller can even finish, so the
# binary cannot be produced locally. A hosted runner has no such scanner in the way.
on:
  workflow_dispatch:

jobs:
  build:
    name: Photon Finish Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Some runner images ship Inno Setup and some do not; install only when missing.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }

      - name: Build the app and installer
        shell: pwsh
        run: |
          # Reuse the real build script instead of restating its PyInstaller flag list.
          # Two copies of that list would drift, and this script is what a maintainer
          # actually runs by hand. It recreates its own .venv-build, which costs a minute
          # or two -- worth it to keep ONE definition of the build.
          $env:SEESTAR_BUILD_PYTHON = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File packaging\build_app_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_app_windows.ps1 failed with exit code $LASTEXITCODE" }

      - name: Install silently and selftest the installed app
        shell: pwsh
        run: |
          # Test what users get: the app as the installer lays it down, not just the
          # PyInstaller folder it was made from.
          #
          # The selftests are the frozen-only gates from docs/CLEAN_BUILD_TEST.md section 3.
          # None can be checked from source: each exercises PyInstaller's frozen filesystem
          # (package data, the static UI, a real server boot through the launch-token
          # exchange). Headless, so CI can run them -- the double-click window test still
          # needs a human and is NOT covered here.
          #
          # Start-Process -Wait is required, not stylistic: the app is built --windowed
          # (GUI subsystem) and Inno Setup's installer is a GUI program too, so PowerShell
          # does not wait for either and $LASTEXITCODE would be meaningless. A windowed
          # build also has no stdout, so the selftest output lands in the app log, which
          # we print for diagnosis.
          $setup = ".\dist\Photon Finish Setup.exe"
          if (-not (Test-Path $setup)) { throw "expected build output not found: $setup" }
          $dir = "$env:RUNNER_TEMP\Photon Finish"
          $p = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "installer failed with exit code $($p.ExitCode)" }

          $exe = "$dir\Photon Finish.exe"
          if (-not (Test-Path $exe)) { throw "installed app not found: $exe" }
          Write-Host "testing: $exe"
          $log = "$env:LOCALAPPDATA\Photon Finish\logs\app.log"
          foreach ($t in @("known-targets", "gui-static", "gui-server")) {
            $env:SEESTAR_SELFTEST = $t
            $p = Start-Process -FilePath $exe -Wait -PassThru
            if (Test-Path $log) { Write-Host "--- app.log after $t ---"; Get-Content $log -Tail 20 }
            if ($p.ExitCode -ne 0) { throw "selftest '$t' failed with exit code $($p.ExitCode)" }
            Write-Host "selftest '$t' OK"
          }

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: photon-finish-windows-setup
          path: dist/Photon Finish Setup.exe
          if-no-files-found: error
